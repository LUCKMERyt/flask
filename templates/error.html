{% extends 'base.html' %}

{% block title %}{{ code }} — {{ title }}{% endblock %}

{% block content %}
<section class="error-page reveal">
    <p class="error-page__code">{{ code }}</p>
    <h1 class="error-page__title">{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <div class="error-page__actions">
        <a class="btn btn--primary" href="{{ url_for('home') }}">На главную</a>
        <a class="btn btn--ghost" href="{{ url_for('catalog') }}">В каталог</a>
    </div>
</section>
{% endblock %}
